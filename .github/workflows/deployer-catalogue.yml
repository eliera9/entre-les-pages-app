name: Déployer la fonction catalogue

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/functions/catalogue/**"
      - "site/promesse.js"
      - "site/catalogue-engine.js"

jobs:
  deployer:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Déployer
        run: supabase functions deploy catalogue --project-ref onbizlpuzybodnmdtacx --use-api
